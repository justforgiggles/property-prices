name: Set up property-prices
description: Install the shared Node, Python and native dependencies
runs:
  using: composite
  steps:
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
        cache: npm
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.14'
        cache: pip
        cache-dependency-path: packages/model/pyproject.toml
    - shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgomp1 fonts-liberation
        npm ci
        python -m venv packages/model/.venv
        packages/model/.venv/bin/python -m pip install -e packages/model functions-framework==3.9.2

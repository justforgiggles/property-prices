name: Scrape on DigitalOcean
on:
  schedule:
    - cron: '0 16 * * *'
      timezone: 'Europe/Berlin'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/scrape-completed.json']
permissions:
  contents: read
concurrency:
  group: scraper-infrastructure
  cancel-in-progress: false
  queue: max
jobs:
  start:
    if: github.event_name != 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: scraping
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Remove previous scraper and start detached worker
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          SCRAPE_DEPLOY_KEY: ${{ secrets.SCRAPE_DEPLOY_KEY }}
          OXYLABS_USERNAME: ${{ secrets.OXYLABS_USERNAME }}
          OXYLABS_PASSWORD: ${{ secrets.OXYLABS_PASSWORD }}
        run: python3 scripts/scrape-infrastructure.py start
  cleanup:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: scraping
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Delete only the completed run's droplet
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: python3 scripts/scrape-infrastructure.py cleanup

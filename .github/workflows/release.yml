name: Release model and forms
on:
  push:
    branches: [main]
    paths:
      - 'data/raw/**'
      - 'data/scrape-completed.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: production
    permissions:
      contents: write
      id-token: write
    env:
      GCLOUD_ACCOUNT: ''
      GCLOUD_BUILD_SERVICE_ACCOUNT: ${{ vars.GCP_BUILD_SERVICE_ACCOUNT }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Train and generate forms
        run: |
          ./scripts/train.sh
          npm run agents
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
      - name: Verify and deploy model
        run: ./scripts/deploy.sh
      - name: Publish generated locations, forms, and artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/model/locations.json forms/property-valuation*.yaml forms/assets/*
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated forms and locations [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi

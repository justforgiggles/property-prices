          - type: required
            message: Select a suburb.
          - type: expression
            expression: data.city !== "Heidelberg" || (data.province === "Gauteng" && ["Berg En Dal","Bergsig","Heidelberg AH","Heidelberg Central","Heidelberg Ext 5","Heidelberg Industrial","Heidelberg Kloof Estate","Heidelberg Proper","Jordaan Park","Obed Mthombeni Nkosi","Overkruin","Ratanda","Rensburg","Spaarwater AH"].includes(data.suburb)) || (data.province === "Western Cape" && ["Heidelberg"].includes(data.suburb))
            message: Choose a suburb in your selected province.
    next: property
  - id: property
    title: Property details
    description: Accurate property details help produce a more useful estimate.
    button: Continue
    fields:
      - id: bedrooms
        type: number
        label: How many bedrooms does it have?
        validators:
          - type: required
            message: Enter the number of bedrooms.
          - type: pattern
            regex: ^\d+$
            message: Enter bedrooms as a whole number.
          - type: min
            value: 1
            message: Enter at least 1 bedroom.
          - type: max
            value: 20
            message: Enter 20 bedrooms or fewer.
      - id: bathrooms
        type: number
        label: How many bathrooms does it have?
        validators:
          - type: required
            message: Enter the number of bathrooms.
          - type: pattern
            regex: ^\d+$
            message: Enter bathrooms as a whole number.
          - type: min
            value: 1
            message: Enter at least 1 bathroom.
          - type: max
            value: 20
            message: Enter 20 bathrooms or fewer.
      - id: floor_area
        type: number
        label: What is the floor size (m²)?
        helper_text: Exclude the erf or plot.
        validators:
          - type: required
            message: Enter the floor size.
          - type: pattern
            regex: ^\d+$
            message: Enter floor size as a whole number.
          - type: min
            value: 10
            message: Enter a floor size of at least 10 m².
          - type: max
            value: 5000
            message: Enter a floor size of 5,000 m² or less.
      - id: rates_and_taxes
        type: number
        label: What are the monthly municipal rates and taxes (R)?
        helper_text: Exclude levies.
        validators:
          - type: required
            message: Enter the monthly rates and taxes.
          - type: pattern
            regex: ^\d+$
            message: Enter rates and taxes in whole rands.
          - type: min
            value: 1
            message: Enter monthly rates and taxes of at least R1.
          - type: max
            value: 100000
            message: Enter monthly rates and taxes of R100,000 or less.
    next: delivery
  - id: delivery
    title: Contact details
    description: Enter your email to view your estimate. You can also request contact from Wihan.
    button: Show my estimate
    fields:
      - id: first_name
        type: short_text
        label: What is your first name?
        placeholder: Thandi
        validators:
          - type: max_length
            value: 80
            message: Enter a first name of 80 characters or fewer.
      - id: email
        type: email
        label: What is your email address?
        placeholder: thandi@example.com
        validators:
          - type: required
            message: Enter your email address.
          - type: pattern
            regex: ^[^\s@]+@[^\s@]+\.[^\s@]+$
            message: Enter a valid email address.
      - id: phone
        type: mobile_number
        label: What is your phone number?
        placeholder: 082 123 4567
        validators:
          - type: pattern
            regex: ^\+?(?:[ ()-]*[0-9]){7,15}[ ()-]*$
            message: Enter a valid phone number.
      - id: privacy_notice
        type: text_block
        content: Your details are used for your estimate and shared with Wihan only if you request contact. [Privacy notice](https://example.invalid/REPLACE_PRIVACY_NOTICE).
      - id: agent_contact_consent
        type: checkbox
        label: I’d like Wihan to contact me about my property.
    next: done
completion:
  - when: data.prediction && data.prediction.recommended_asking_price_zar
    title: '{{data.prediction.formatted_asking_price}}'
    message: Estimated asking price based on South African property listings. This is not a formal valuation or a guarantee of the sale price. <br/><br/>Ready for your next move? Chat to Wihan.
    button:
      label: WhatsApp Wihan
      url: https://wa.me/27845586006?text=Hi%20Wihan%2C%20I%E2%80%99d%20like%20to%20discuss%20my%20property.
  - title: Your estimate isn’t available right now
    message: We couldn’t display your estimate. Please try again later.
connections:
  - type: webhook
    url: https://property-prices-valuation-1008115912104.europe-west3.run.app
    trigger_on: partial
  - type: email
    to: wihan@simplyre.co.za
    trigger_on: completed
    include_responses: false
    subject: New valuation lead — {{calculate "String(data.first_name || '').trim().replaceAll(String.fromCharCode(13), ' ').replaceAll(String.fromCharCode(10), ' ') || 'Name not provided'"}} — {{calculate "String(data.suburb || '').trim().replaceAll(String.fromCharCode(13), ' ').replaceAll(String.fromCharCode(10), ' ') || 'Not provided'"}}
    body: |
      <div style="font-family:Arial,sans-serif;color:#24352b;line-height:1.6;max-width:640px">
        <h1 style="font-size:24px">New property valuation lead</h1>
        <p>A completed property valuation submission has been received.</p>
        <h2 style="font-size:18px">Contact details</h2>
        <table cellpadding="6" cellspacing="0" style="text-align:left">
          <tr><th scope="row">First name</th><td>{{calculate "String(data.first_name == null || String(data.first_name).trim() === '' ? 'Not provided' : data.first_name).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Email</th><td>{{calculate "String(data.email == null || String(data.email).trim() === '' ? 'Not provided' : data.email).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Phone</th><td>{{calculate "String(data.phone == null || String(data.phone).trim() === '' ? 'Not provided' : data.phone).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Contact requested</th><td>{{calculate "data.agent_contact_consent === true ? 'Yes' : 'No'"}}</td></tr>
        </table>
        <h2 style="font-size:18px">Property details</h2>
        <table cellpadding="6" cellspacing="0" style="text-align:left">
          <tr><th scope="row">Province</th><td>{{calculate "String(data.province == null || String(data.province).trim() === '' ? 'Not provided' : data.province).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">City</th><td>{{calculate "String(data.city == null || String(data.city).trim() === '' ? 'Not provided' : data.city).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Suburb</th><td>{{calculate "String(data.suburb == null || String(data.suburb).trim() === '' ? 'Not provided' : data.suburb).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Bedrooms</th><td>{{calculate "String(data.bedrooms == null || String(data.bedrooms).trim() === '' ? 'Not provided' : data.bedrooms).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Bathrooms</th><td>{{calculate "String(data.bathrooms == null || String(data.bathrooms).trim() === '' ? 'Not provided' : data.bathrooms).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Floor area (m²)</th><td>{{calculate "String(data.floor_area == null || String(data.floor_area).trim() === '' ? 'Not provided' : data.floor_area).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
          <tr><th scope="row">Rates and taxes (R per month)</th><td>{{calculate "String(data.rates_and_taxes == null || String(data.rates_and_taxes).trim() === '' ? 'Not provided' : data.rates_and_taxes).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</td></tr>
        </table>
        <h2 style="font-size:18px">Estimate</h2>
        <p><strong>Estimated asking price:</strong> {{calculate "String(typeof data.prediction?.recommended_asking_price_zar === 'number' && Number.isFinite(data.prediction.recommended_asking_price_zar) ? 'R' + data.prediction.recommended_asking_price_zar.toLocaleString('en-ZA', {maximumFractionDigits: 0}) : 'Estimate unavailable when this notification was sent.').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</p>
        <p><strong>Comparable properties:</strong> {{calculate "String(data.prediction?.comparable_count ?? 'Not provided').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll(String.fromCharCode(34), '&quot;').replaceAll(String.fromCharCode(39), '&#39;')"}}</p>
      </div>

# yaml-language-server: $schema=https://frms.dev/schema.json
version: 1
# Generated by npm run generate:agents. Edit the agent profile or shared template.
title: "${name} | ${agency}"
description: "Get your free home asking-price estimate."

theme:
  mode: light
  primary: "${primary}"
  logo:
    image: "${logo_url}"
    height: ${logo_height}
  icon: "${icon_url}"

open_graph:
  image: "${og_url}"

start:
  title: "Your home’s asking-price estimate with ${name}"
  description: "Planning your next move? Get a free estimate with ${short_name} at ${agency_office}, based on South African property listings."
  button: "Get my free estimate"

measurements:
  posthog:
    token: "phc_PG5OhDQIzFkoQxel2QjLVC85JPW0hHBB8gJkruofkrS"
    api_host: "https://eu.i.posthog.com"

authentication:
  verifier: "bd03158a644c5fca35e1aa40846e47eea7d8b0a0cebbd106c354044e4018f5da"

sections:
  - id: location
    title: "Property location"
    description: "Select the location of the property you’d like to estimate."
    button: "Continue"
    fields:
      - id: province
        type: dropdown
        label: "Which province is your property in?"
        placeholder: "Select a province"
        options:
          - label: "Gauteng"
            value: "Gauteng"
          - label: "KwaZulu-Natal"
            value: "KwaZulu Natal"
          - label: "Western Cape"
            value: "Western Cape"
        validators:
          - type: required
            message: "Select a province."

@@LOCATION_FIELDS@@
    next: property

  - id: property
    title: "Property details"
    description: "Accurate property details help produce a more useful estimate."
    button: "Continue"
    fields:
      - id: bedrooms
        type: number
        label: "How many bedrooms does it have?"
        validators:
          - type: required
            message: "Enter the number of bedrooms."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter bedrooms as a whole number."
          - type: min
            value: 1
            message: "Enter at least 1 bedroom."
          - type: max
            value: 20
            message: "Enter 20 bedrooms or fewer."

      - id: bathrooms
        type: number
        label: "How many bathrooms does it have?"
        validators:
          - type: required
            message: "Enter the number of bathrooms."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter bathrooms as a whole number."
          - type: min
            value: 1
            message: "Enter at least 1 bathroom."
          - type: max
            value: 20
            message: "Enter 20 bathrooms or fewer."

      - id: floor_area
        type: number
        label: "What is the floor size (m²)?"
        helper_text: "Exclude the erf or plot."
        validators:
          - type: required
            message: "Enter the floor size."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter floor size as a whole number."
          - type: min
            value: 10
            message: "Enter a floor size of at least 10 m²."
          - type: max
            value: 5000
            message: "Enter a floor size of 5,000 m² or less."

      - id: rates_and_taxes
        type: number
        label: "What are the monthly municipal rates and taxes (R)?"
        helper_text: "Exclude levies."
        validators:
          - type: required
            message: "Enter the monthly rates and taxes."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter rates and taxes in whole rands."
          - type: min
            value: 1
            message: "Enter monthly rates and taxes of at least R1."
          - type: max
            value: 100000
            message: "Enter monthly rates and taxes of R100,000 or less."
    next: delivery

  - id: delivery
    title: "Contact details"
    description: "Enter your email to view your estimate. You can also request contact from ${short_name}."
    button: "Show my estimate"
    fields:
      - id: first_name
        type: short_text
        label: "What is your first name?"
        placeholder: "Thandi"
        validators:
          - type: max_length
            value: 80
            message: "Enter a first name of 80 characters or fewer."

      - id: email
        type: email
        label: "What is your email address?"
        placeholder: "thandi@example.com"
        validators:
          - type: required
            message: "Enter your email address."
          - type: pattern
            regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
            message: "Enter a valid email address."

      - id: phone
        type: mobile_number
        label: "What is your phone number?"
        placeholder: "082 123 4567"
        validators:
          - type: pattern
            regex: '^\+?(?:[ ()-]*[0-9]){7,15}[ ()-]*$'
            message: "Enter a valid phone number."

      - id: privacy_notice
        type: text_block
        content: "Your details are used for your estimate and shared with ${short_name} only if you request contact. [Privacy notice](${privacy_url})."

      - id: agent_contact_consent
        type: checkbox
        label: "I’d like ${short_name} to contact me about my property."

    next: done

completion:
  - when: "data.prediction && data.prediction.recommended_asking_price_zar"
    title: "{{data.prediction.formatted_asking_price}}"
    message: "Estimated asking price based on South African property listings. This is not a formal valuation or a guarantee of the sale price. <br/><br/>Ready for your next move? Chat to ${short_name}."
    button:
      label: "WhatsApp ${short_name}"
      url: "${whatsapp_url}"
  - title: "Your estimate isn’t available right now"
    message: "We couldn’t display your estimate. Please try again later."

connections:
  - type: webhook
    url: "https://property-prices-valuation-1008115912104.europe-west3.run.app"
    trigger_on: partial

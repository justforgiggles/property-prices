  - id: property
    title: "Tell us about your property"
    description: "Enter the details as accurately as you can. If you are unsure, use your best estimate."
    fields:
      - id: bedrooms
        type: number
        label: "Bedrooms"
        validators:
          - type: required
            message: "Enter the number of bedrooms."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter bedrooms as a whole number."
          - type: min
            value: 1
            message: "Enter at least 1 bedroom."
          - type: max
            value: 20
            message: "Enter 20 bedrooms or fewer."

      - id: bathrooms
        type: number
        label: "Bathrooms"
        validators:
          - type: required
            message: "Enter the number of bathrooms."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter bathrooms as a whole number."
          - type: min
            value: 1
            message: "Enter at least 1 bathroom."
          - type: max
            value: 20
            message: "Enter 20 bathrooms or fewer."

      - id: floor_area
        type: number
        label: "Floor size (m²)"
        helper_text: "Enter the floor size of the house, apartment or townhouse, not the erf or plot size. Use a whole number."
        validators:
          - type: required
            message: "Enter the floor size."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter floor size as a whole number."
          - type: min
            value: 10
            message: "Enter a floor size of at least 10 m²."
          - type: max
            value: 5000
            message: "Enter a floor size of 5,000 m² or less."

      - id: rates_and_taxes
        type: number
        label: "Monthly municipal rates and taxes (R)"
        helper_text: "Enter the monthly municipal amount, excluding levies. Use whole rands."
        validators:
          - type: required
            message: "Enter the monthly rates and taxes."
          - type: pattern
            regex: "^\\d+$"
            message: "Enter rates and taxes in whole rands."
          - type: min
            value: 1
            message: "Enter monthly rates and taxes of at least R1."
          - type: max
            value: 100000
            message: "Enter monthly rates and taxes of R100,000 or less."
    next: delivery

  - id: delivery
    title: "Where should we send your estimate?"
    description: "We will email your recommended asking price as soon as it is ready."
    fields:
      - id: first_name
        type: short_text
        label: "First name (optional)"
        placeholder: "Thandi"
        validators:
          - type: max_length
            value: 80
            message: "Enter a first name of 80 characters or fewer."

      - id: email
        type: email
        label: "Email address"
        placeholder: "thandi@example.com"
        helper_text: "We will only use this email to send your estimate. No marketing messages."
        validators:
          - type: required
            message: "Enter your email address."
          - type: pattern
            regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
            message: "Enter a valid email address."

    next: done

completion:
  title: "Your estimate is on its way"
  message: "We are calculating your estimated asking price now and will email it to {{data.email}} shortly. If you do not see it, check your spam folder."

connections:
  - type: webhook
    url: "https://property-prices-valuation-1008115912104.europe-west3.run.app"
    trigger_on: completed
    delay_minutes: 2

  - type: email
    to: "hirebarend@gmail.com"
    subject: "New property valuation submission"
    body: "A completed property valuation form was submitted."
    include_responses: true
    trigger_on: completed

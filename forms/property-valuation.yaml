  - id: property
    title: "Tell us about the property"
    description: "Use your best estimate if you do not know an exact figure."
    fields:
      - id: property_type
        type: single_select
        label: "Property type"
        options:
          - "House"
          - "Apartment / Flat"
          - "Townhouse"
        validators:
          - required

      - id: bedrooms
        type: number
        label: "Bedrooms"
        validators:
          - required
          - type: min
            value: 1
            message: "Enter at least 1 bedroom."
          - type: max
            value: 20
            message: "Enter 20 bedrooms or fewer."

      - id: bathrooms
        type: number
        label: "Bathrooms"
        validators:
          - required
          - type: min
            value: 1
            message: "Enter at least 1 bathroom."
          - type: max
            value: 20
            message: "Enter 20 bathrooms or fewer."

      - id: floor_area
        type: number
        label: "Floor area (m²)"
        validators:
          - required
          - type: min
            value: 10
            message: "Enter a floor area of at least 10 m²."
          - type: max
            value: 5000
            message: "Enter a floor area of 5,000 m² or less."
    next: delivery

  - id: delivery
    title: "Where should we send your estimate?"
    description: "We will email your indicative valuation as soon as it is ready."
    fields:
      - id: first_name
        type: short_text
        label: "First name (optional)"
        placeholder: "Thandi"
        validators:
          - type: max_length
            value: 80

      - id: email
        type: email
        label: "Email address"
        placeholder: "thandi@example.com"
        validators:
          - required
          - type: pattern
            regex: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
            message: "Enter a valid email address."

      - id: privacy_note
        type: text_block
        content: "We will use your email only to send this valuation. No marketing messages."

      - id: valuation_note
        type: text_block
        content: "This estimate uses recent property listing data and is indicative only. It is not a formal valuation or a record of completed sale prices."
    next: done

completion:
  title: "Your estimate is on its way"
  message: "We are calculating it now and will email it to {{data.email}} shortly. If it does not arrive, check your spam folder."

connections:
  - type: webhook
    url: "https://property-prices-valuation-1008115912104.europe-west3.run.app"
    trigger_on: completed
    delay_minutes: 2

  - type: email
    to: "hirebarend@gmail.com"
    subject: "New property valuation submission"
    body: "A completed property valuation form was submitted."
    include_responses: true
    trigger_on: completed

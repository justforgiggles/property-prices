# yaml-language-server: $schema=https://frms.dev/schema.json
version: 1
title: "South African property value estimate"
description: "Get an instant, data-driven estimate based on recent South African property listings."

start:
  title: "Know what your property could be worth"
  description: "It takes about two minutes, and we will email your estimated value and range. This is an indicative estimate, not a formal valuation."
  button: "Get my free estimate"

sections:
  - id: province
    title: "Which province is the property in?"
    description: "We currently cover Gauteng, KwaZulu-Natal and the Western Cape."
    fields:
      - id: province
        type: single_select
        label: "Province"
        options:
          - label: "Gauteng"
            value: "Gauteng"
          - label: "KwaZulu-Natal"
            value: "KwaZulu Natal"
          - label: "Western Cape"
            value: "Western Cape"
        validators:
          - required
    next:
      - when: "data.province === 'Gauteng'"
        go: city_gauteng
      - when: "data.province === 'KwaZulu Natal'"
        go: city_kwazulu_natal
      - else: city_western_cape

  - id: city_gauteng
    title: "Which city or town is the property in?"
    description: "Choose a supported area in Gauteng."
    fields:
      - id: city
        type: dropdown
        label: "City or town"
        searchable: true
        options:
          - "Johannesburg"
          - "Sandton"
        validators:
          - required
    next:
      - when: "data.city === 'Johannesburg'"
        go: suburb_johannesburg
      - else: suburb_sandton

  - id: city_kwazulu_natal
    title: "Which city or town is the property in?"
    description: "Choose a supported area in KwaZulu-Natal."
    fields:
      - id: city
        type: dropdown
        label: "City or town"
        searchable: true
        options:
          - "Durban"
        validators:
          - required
    next: suburb_durban

  - id: city_western_cape
    title: "Which city or town is the property in?"
    description: "Choose a supported area in Western Cape."
    fields:
      - id: city
        type: dropdown
        label: "City or town"
        searchable: true
        options:
          - "Blouberg"
          - "Cape Town"
          - "Durbanville"
        validators:
          - required
    next:
      - when: "data.city === 'Blouberg'"
        go: suburb_blouberg
      - when: "data.city === 'Cape Town'"
        go: suburb_cape_town
      - else: suburb_durbanville

